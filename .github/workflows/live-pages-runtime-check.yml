name: Live Pages runtime check

on:
  push:
    branches: [ live-pages-runtime-test ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install browser test dependency
        run: python3 -m pip install --disable-pip-version-check selenium

      - name: Verify deployed Pages game leaves Loading state
        run: python3 scripts/live-pages-runtime-smoke.py

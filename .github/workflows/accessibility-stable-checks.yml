name: Accessibility checks

on:
  push:
    branches: [ accessibility-master-integration, master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check helper syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src/game/helpers/ui -maxdepth 1 -name 'Accessibility*.js' -print0)
          node --check src/game/GameGlobalsInitializer.js
          node --check scripts/accessibility-stable-smoke.js
          node --check scripts/accessibility-overview-refresh-contract.js
          node --check scripts/accessibility-scout-actionable-contract.js
          node --check scripts/accessibility-movement-position-contract.js
          python3 -m py_compile scripts/accessibility-master-runtime-smoke.py scripts/accessibility-overview-refresh-smoke.py scripts/accessibility-scout-actionable-smoke.py scripts/accessibility-movement-position-smoke.py

      - name: Verify accessibility wiring on master
        run: |
          node scripts/accessibility-stable-smoke.js
          node scripts/accessibility-overview-refresh-contract.js
          node scripts/accessibility-scout-actionable-contract.js
          node scripts/accessibility-movement-position-contract.js

      - name: Install browser test dependency
        run: python3 -m pip install --disable-pip-version-check selenium

      - name: Verify accessibility compatibility in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --directory .. >/tmp/level13-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          export LEVEL13_BASE_URL="http://127.0.0.1:8000/level13-huyhuy/"
          python3 scripts/accessibility-master-runtime-smoke.py
          python3 scripts/accessibility-overview-refresh-smoke.py
          python3 scripts/accessibility-scout-actionable-smoke.py
          python3 scripts/accessibility-movement-position-smoke.py
